<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F19" />
      <stop offset="50%" stopColor="#111827" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>

    <!-- Vibrant Neon Accent Gradients -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF6B00" />
      <stop offset="100%" stopColor="#F28C28" />
    </linearGradient>

    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#3B82F6" />
      <stop offset="50%" stopColor="#8B5CF6" />
      <stop offset="100%" stopColor="#EC4899" />
    </linearGradient>

    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#0F172A" stopOpacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Ambient Radiant Orbs -->
  <circle cx="160" cy="120" r="140" fill="#FF6B00" opacity="0.18" filter="url(#glow)" />
  <circle cx="640" cy="320" r="160" fill="#8B5CF6" opacity="0.2" filter="url(#glow)" />
  <circle cx="400" cy="225" r="180" fill="#3B82F6" opacity="0.12" filter="url(#glow)" />

  <!-- Futuristic Grid Lines -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="4 8">
    <line x1="50" y1="0" x2="50" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="650" y1="0" x2="650" y2="450" />
    <line x1="750" y1="0" x2="750" y2="450" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- 3D Floating Mobile Video Reels Mockups -->
  <!-- Left Reel Card (Tilted) -->
  <g transform="translate(110, 100) rotate(-8)">
    <rect width="130" height="230" rx="16" fill="url(#reelGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#subtleGlow)" />
    <!-- Screen Header -->
    <rect x="12" y="14" width="60" height="8" rx="4" fill="#38BDF8" opacity="0.6" />
    <!-- Video Content Simulation: AI Avatar Shape -->
    <circle cx="65" cy="85" r="32" fill="#1E293B" stroke="#00C4CC" stroke-width="1.5" />
    <path d="M50 135 C50 110, 80 110, 80 135 Z" fill="#38BDF8" opacity="0.4" />
    <polygon points="61,78 74,85 61,92" fill="#00C4CC" />
    <!-- Audio Waveform -->
    <g fill="#38BDF8" opacity="0.7">
      <rect x="20" y="160" width="4" height="22" rx="2" />
      <rect x="28" y="152" width="4" height="38" rx="2" />
      <rect x="36" y="145" width="4" height="52" rx="2" />
      <rect x="44" y="156" width="4" height="30" rx="2" />
      <rect x="52" y="148" width="4" height="46" rx="2" />
      <rect x="60" y="162" width="4" height="18" rx="2" />
      <rect x="68" y="150" width="4" height="42" rx="2" />
      <rect x="76" y="155" width="4" height="32" rx="2" />
      <rect x="84" y="163" width="4" height="16" rx="2" />
      <rect x="92" y="158" width="4" height="26" rx="2" />
      <rect x="100" y="165" width="4" height="12" rx="2" />
    </g>
    <!-- Heart & Share Icons -->
    <circle cx="108" cy="110" r="8" fill="#EC4899" opacity="0.8" />
    <circle cx="108" cy="130" r="8" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Right Reel Card (Tilted) -->
  <g transform="translate(560, 95) rotate(7)">
    <rect width="130" height="230" rx="16" fill="url(#reelGrad)" stroke="#EC4899" stroke-width="1.5" filter="url(#subtleGlow)" />
    <!-- Screen Header -->
    <rect x="12" y="14" width="70" height="8" rx="4" fill="#EC4899" opacity="0.6" />
    <!-- Video Content Simulation: AI Tech / Matrix -->
    <rect x="14" y="32" width="102" height="110" rx="10" fill="#181824" stroke="#8B5CF6" stroke-width="1" />
    <!-- Play Icon -->
    <circle cx="65" cy="87" r="24" fill="#EC4899" opacity="0.3" />
    <polygon points="60,77 75,87 60,97" fill="#FFFFFF" />
    <!-- Views Tag -->
    <rect x="14" y="154" width="102" height="22" rx="6" fill="#8B5CF6" opacity="0.3" />
    <text x="65" y="169" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="sans-serif">🔥 2.5M VIEWS</text>
    <!-- Progress Bar -->
    <rect x="14" y="195" width="102" height="4" rx="2" fill="#334155" />
    <rect x="14" y="195" width="68" height="4" rx="2" fill="#EC4899" />
  </g>

  <!-- Center Hero Showcase Reel Card -->
  <g transform="translate(325, 45)">
    <!-- Glow Backdrop -->
    <rect x="-8" y="-8" width="166" height="296" rx="24" fill="url(#orangeGlow)" opacity="0.35" filter="url(#glow)" />
    <!-- Phone Screen Body -->
    <rect width="150" height="280" rx="20" fill="#0A0F1D" stroke="url(#orangeGlow)" stroke-width="2.5" />
    
    <!-- Camera Notch -->
    <rect x="52" y="8" width="46" height="6" rx="3" fill="#1E293B" />
    
    <!-- Screen Artwork: Dynamic AI Reel Preview -->
    <g transform="translate(10, 24)">
      <rect width="130" height="210" rx="12" fill="#111827" />
      
      <!-- Luminous Energy Vortex -->
      <circle cx="65" cy="85" r="45" fill="none" stroke="url(#cyberGlow)" stroke-width="2.5" stroke-dasharray="6 4" />
      <circle cx="65" cy="85" r="32" fill="none" stroke="url(#orangeGlow)" stroke-width="2" />
      
      <!-- Big Center Play Button -->
      <circle cx="65" cy="85" r="22" fill="url(#orangeGlow)" filter="url(#subtleGlow)" />
      <polygon points="59,74 76,85 59,96" fill="#FFFFFF" />

      <!-- HD AI Badge -->
      <rect x="14" y="14" width="46" height="18" rx="4" fill="#000000" opacity="0.75" />
      <text x="37" y="27" text-anchor="middle" fill="#00F0FF" font-size="10" font-weight="900" font-family="sans-serif">4K AI</text>

      <!-- Video Captions Mockup -->
      <rect x="14" y="145" width="102" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
      <rect x="14" y="157" width="75" height="6" rx="3" fill="#F28C28" opacity="0.9" />
      <rect x="14" y="169" width="88" height="6" rx="3" fill="#FFFFFF" opacity="0.6" />

      <!-- Stats Bar -->
      <g transform="translate(14, 185)">
        <text x="0" y="12" fill="#22C55E" font-size="11" font-weight="800" font-family="sans-serif">100% VIRAL READY</text>
      </g>
    </g>

    <!-- Bottom Bar Button on phone -->
    <rect x="15" y="244" width="120" height="24" rx="8" fill="url(#orangeGlow)" />
    <text x="75" y="260" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800" font-family="sans-serif">DOWNLOAD NOW</text>
  </g>

  <!-- Top Floating Feature Badges -->
  <g transform="translate(50, 40)">
    <rect width="180" height="34" rx="17" fill="#111827" stroke="#F28C28" stroke-width="1.5" />
    <circle cx="20" cy="17" r="7" fill="#22C55E" />
    <text x="98" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="sans-serif">⚡ Ready to Monetize</text>
  </g>

  <g transform="translate(570, 38)">
    <rect width="180" height="34" rx="17" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="20" cy="17" r="7" fill="#38BDF8" />
    <text x="98" y="22" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="sans-serif">✨ No Watermark</text>
  </g>

  <!-- Bottom Hero Banner Text Overlay / Title Card -->
  <g transform="translate(40, 345)">
    <!-- Glassmorphic Container -->
    <rect width="720" height="92" rx="18" fill="#0A0F1D" fill-opacity="0.92" stroke="url(#cyberGlow)" stroke-width="1.5" filter="url(#subtleGlow)" />

    <!-- Left side: 2000+ AI Videos Bundle Headline -->
    <text x="28" y="38" fill="#FFFFFF" font-size="24" font-weight="900" font-family="sans-serif" letter-spacing="0.5">
      2000+ AI VIDEOS BUNDLE
    </text>
    <text x="28" y="66" fill="#94A3B8" font-size="13" font-weight="500" font-family="sans-serif">
      Reels, Shorts &amp; TikToks • High-Def Quality • Instant Drive Access
    </text>

    <!-- Right side: ONLY ₹99 Price Pill -->
    <g transform="translate(560, 20)">
      <rect width="135" height="52" rx="12" fill="url(#orangeGlow)" />
      <text x="67" y="24" text-anchor="middle" fill="#FFF5EB" font-size="11" font-weight="700" font-family="sans-serif" letter-spacing="1">ONLY</text>
      <text x="67" y="44" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="900" font-family="sans-serif">₹99</text>
    </g>

    <!-- Discount Strike Through -->
    <g transform="translate(485, 32)">
      <text x="35" y="18" text-anchor="middle" fill="#64748B" font-size="14" font-weight="600" font-family="sans-serif" text-decoration="line-through">₹999</text>
      <text x="35" y="34" text-anchor="middle" fill="#22C55E" font-size="10" font-weight="800" font-family="sans-serif">90% OFF</text>
    </g>
  </g>
</svg>